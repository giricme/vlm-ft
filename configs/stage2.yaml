# Stage 2: Multi-turn Training
# Reasoning chains with conversation context
# Builds on Stage 1 - load checkpoint from stage1/best

experiment_name: robovqa_stage2
output_dir: experiments
seed: 42

# Training parameters
batch_size: 2  # Smaller for longer sequences
gradient_accumulation_steps: 16  # Effective batch size: 32
num_epochs: 2
max_steps: null

# Evaluation and checkpointing
eval_steps: 250
eval_batch_size: 4
eval_samples: 500
save_steps: 500
save_total_limit: 3

# IMPORTANT: Set this to your Stage 1 checkpoint path
# Example: experiments/robovqa_stage1_20241201_143000/checkpoints/best
resume_from_checkpoint: null

# Logging
logging_steps: 10
log_level: INFO
wandb_enabled: false
wandb_project: vla-ft
wandb_mode: offline

# Data configuration
data:
  data_dir: data/robovqa/processed
  images_subdir: images
  stage: 2  # Multi-turn conversations
  max_frames: 16
  max_length: 4096  # Longer for multi-turn context
  subset_ratio: 0.1  # Start with 10%
  max_samples: null
  num_workers: 4

# Model configuration
model:
  model_name: InternVL3-8B
  model_path: null
  use_qlora: true
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2
  gradient_checkpointing: true
  
  # LoRA parameters (same as stage 1 for continuity)
  lora_r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  lora_target_modules: null

# Optimizer configuration
optimizer:
  optimizer: adamw
  learning_rate: 1.0e-4  # Lower LR for stage 2 fine-tuning
  weight_decay: 0.01
  warmup_ratio: 0.03
  warmup_steps: null
  lr_scheduler: cosine
  max_grad_norm: 1.0
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8