# Stage 1: Split QA Training
# Basic visual grounding with single QA pairs
# Start with 10% subset for validation before scaling

experiment_name: robovqa_stage1
output_dir: experiments
seed: 42

# Training parameters
batch_size: 4
gradient_accumulation_steps: 8  # Effective batch size: 32
num_epochs: 3
max_steps: null  # Set to limit training steps

# Evaluation and checkpointing
eval_steps: 500
eval_batch_size: 8
eval_samples: 1000
save_steps: 1000
save_total_limit: 3
resume_from_checkpoint: null

# Logging
logging_steps: 10
log_level: INFO
wandb_enabled: false
wandb_project: vla-ft
wandb_mode: offline

# Data configuration
data:
  data_dir: data/robovqa/processed
  images_subdir: images
  stage: 1
  max_frames: 16
  max_length: 2048
  subset_ratio: 0.1  # Start with 10% for validation
  max_samples: null  # Override subset_ratio if set
  num_workers: 4

# Model configuration
model:
  model_name: InternVL3-8B
  model_path: null  # Use HuggingFace path
  use_qlora: true
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2
  gradient_checkpointing: true
  
  # Memory override for DGX Spark unified memory (set to ~90% of 128GB)
  max_memory_gb: 115
  
  # LoRA parameters
  lora_r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  lora_target_modules: null  # Auto-detect

# Optimizer configuration
optimizer:
  optimizer: adamw
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  warmup_steps: null  # Override warmup_ratio if set
  lr_scheduler: cosine
  max_grad_norm: 1.0
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8