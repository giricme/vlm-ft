# Stage 2 Only: Direct multi-turn training without Stage 1
# Purpose: Test if Stage 2 training alone can handle Stage 1 eval (zero-shot)
#
# Compare this model's Stage 1 eval performance against the curriculum-trained model

experiment_name: robovqa_stage2_only
output_dir: experiments
seed: 42

# Training parameters (same as regular Stage 2)
batch_size: 2
gradient_accumulation_steps: 16
num_epochs: 1
max_steps: null

# Evaluation and checkpointing
eval_steps: 250
eval_batch_size: 4
eval_samples: 500
save_steps: 500
save_total_limit: 3

# NO checkpoint - training from scratch
resume_from_checkpoint: null
reset_scheduler_on_resume: false

# Logging
logging_steps: 1
log_level: INFO
wandb_enabled: false
wandb_project: vlm-ft
wandb_mode: offline

# Data configuration - Stage 2 data
data:
  data_dir: data/robovqa/processed
  images_subdir: images
  stage: 2  # Multi-turn conversations
  max_frames: 10
  max_dynamic_patch: 1
  max_length: 4096
  subset_ratio: 0.1  # Same 10% subset for fair comparison
  max_samples: null
  num_workers: 4

# Model configuration
model:
  model_name: InternVL3-8B
  model_path: null
  use_qlora: true
  torch_dtype: bfloat16
  attn_implementation: sdpa
  gradient_checkpointing: true
  max_memory_gb: 115
  lora_r: 128
  lora_alpha: 256
  lora_dropout: 0.05
  lora_target_modules: null

# Optimizer - use Stage 1 LR since we're starting fresh
optimizer:
  optimizer: adamw
  learning_rate: 4.0e-5  # Higher LR for fresh training
  weight_decay: 0.01
  warmup_ratio: 0.03
  warmup_steps: null
  lr_scheduler: cosine
  max_grad_norm: 1.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8